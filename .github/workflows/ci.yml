name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: update

  keyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run keyboard tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc \
            tests/keyboard_test.cpp src/VIA_Matrix.cpp src/VIA_Keyboard.cpp \
            src/VIA_Protocol.cpp src/VIA_RGBLight.cpp -o keyboard_test && \
            ./keyboard_test

  keyboard-san:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run keyboard tests (ASan/UBSan)
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            tests/keyboard_test.cpp src/VIA_Matrix.cpp src/VIA_Keyboard.cpp \
            src/VIA_Protocol.cpp src/VIA_RGBLight.cpp -o keyboard_test_san && \
            ./keyboard_test_san

  descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run descriptor tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc \
            tests/usb_descriptor_test.cpp -o usb_descriptor_test && \
            ./usb_descriptor_test

  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native matrix test
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc tests/matrix_test.cpp \
            src/VIA_Matrix.cpp -o matrix_test && ./matrix_test
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Isrc tests/matrix_test.cpp \
            src/VIA_Matrix.cpp -o matrix_test_san && ./matrix_test_san

  flash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run flash tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -DSTM32F1xx -Isrc \
            tests/flash_test.cpp src/VIA_STM32F1_Flash.cpp -o flash_test && \
            ./flash_test
      - name: Build and run flash tests (ASan/UBSan)
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -DSTM32F1xx \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            tests/flash_test.cpp src/VIA_STM32F1_Flash.cpp -o flash_test_san && \
            ./flash_test_san

  encoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run encoder tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc tests/encoder_test.cpp -o encoder_test && ./encoder_test
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc tests/encoder_test.cpp -o encoder_test_san && ./encoder_test_san

  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run battery tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc tests/battery_test.cpp -o battery_test && ./battery_test
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc tests/battery_test.cpp -o battery_test_san && ./battery_test_san

  sleep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run sleep tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc tests/sleep_test.cpp -o sleep_test && ./sleep_test
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc tests/sleep_test.cpp -o sleep_test_san && ./sleep_test_san

  nrf52-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run nrf52 adapter tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -DARDUINO_ARCH_NRF52 -DNRF52840_XXAA \
            -Itests/fakes -Isrc tests/nrf52_gpio_hid_test.cpp tests/fakes/bluefruit.cpp -o nrf52_gpio_hid_test && \
            ./nrf52_gpio_hid_test
          g++ -std=c++11 -Wall -Wextra -Werror -DARDUINO_ARCH_NRF52 -DNRF52840_XXAA -DTESTING_ENVIRONMENT \
            -Itests/fakes -Isrc tests/nrf52_ble_transport_test.cpp \
            src/VIA_nRF52_BLE_ViaTransport.cpp tests/fakes/bluefruit.cpp -o nrf52_ble_transport_test && \
            ./nrf52_ble_transport_test
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -DARDUINO_ARCH_NRF52 -DNRF52840_XXAA -DTESTING_ENVIRONMENT \
            -Itests/fakes -Isrc tests/nrf52_ble_transport_test.cpp \
            src/VIA_nRF52_BLE_ViaTransport.cpp tests/fakes/bluefruit.cpp -o nrf52_ble_transport_test_san && \
            ./nrf52_ble_transport_test_san
          g++ -std=c++11 -Wall -Wextra -Werror -DARDUINO_ARCH_NRF52 -DNRF52840_XXAA \
            -Itests/fakes -Isrc tests/nrf52_internalfs_test.cpp \
            src/VIA_nRF52_InternalFS.cpp -o nrf52_internalfs_test && ./nrf52_internalfs_test
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -DARDUINO_ARCH_NRF52 -DNRF52840_XXAA \
            -Itests/fakes -Isrc tests/nrf52_internalfs_test.cpp \
            src/VIA_nRF52_InternalFS.cpp -o nrf52_internalfs_test_san && \
            ./nrf52_internalfs_test_san

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native protocol test
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc \
            tests/protocol_test.cpp src/VIA_Protocol.cpp src/VIA_RGBLight.cpp \
            -o protocol_test
          ./protocol_test
          g++ -std=c++11 -Wall -Wextra -Werror -Itests/fakes -Isrc \
            tests/tinyusb_rawhid_test.cpp src/VIA_TinyUSB_RawHID.cpp \
            -o tinyusb_rawhid_test
          ./tinyusb_rawhid_test failed
          ./tinyusb_rawhid_test successful
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile Arduino example
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli compile --fqbn arduino:avr:uno --libraries . \
            examples/Protocol_Self_Test
      - name: Install RP2040 TinyUSB toolchain
        run: |
          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040
      - name: Compile RP2040 Raw HID reference
        run: |
          arduino-cli compile --fqbn rp2040:rp2040:rpipico:usbstack=tinyusb \
            --libraries . examples/RP2040_VIA_RawHID
      - name: Test nice!nano installer idempotence
        run: |
          TEMP_CORE=$(mktemp -d)
          mkdir -p "$TEMP_CORE/packages/adafruit/hardware/nrf52/1.7.0/variants"
          touch "$TEMP_CORE/packages/adafruit/hardware/nrf52/1.7.0/boards.txt"
          bash .github/scripts/install-nice-nano-variant.sh "$TEMP_CORE"
          bash .github/scripts/install-nice-nano-variant.sh "$TEMP_CORE"
          # Check variant directory exists
          [ -d "$TEMP_CORE/packages/adafruit/hardware/nrf52/1.7.0/variants/pro_micro_nrf52840" ]
          # Check board block added only once
          [ $(grep -c "promicronrf52840.name" "$TEMP_CORE/packages/adafruit/hardware/nrf52/1.7.0/boards.txt") -eq 1 ]
      - name: Install adafruit-nrfutil
        run: pipx install adafruit-nrfutil
      - name: Install Adafruit nRF52 core and nice!nano variant
        run: |
          arduino-cli config add board_manager.additional_urls \
            https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52@1.7.0
          bash .github/scripts/install-nice-nano-variant.sh "$HOME/.arduino15"
      - name: Compile nice!nano BLE example
        run: |
          arduino-cli compile --fqbn adafruit:nrf52:promicronrf52840 \
            --libraries . examples/nice_nano_v2_VIA_BLE

