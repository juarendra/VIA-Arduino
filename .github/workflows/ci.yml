name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: update

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native protocol test
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc \
            tests/protocol_test.cpp src/VIA_Protocol.cpp src/VIA_RGBLight.cpp \
            -o protocol_test
          ./protocol_test
          g++ -std=c++11 -Wall -Wextra -Werror -Itests/fakes -Isrc \
            tests/tinyusb_rawhid_test.cpp src/VIA_TinyUSB_RawHID.cpp \
            -o tinyusb_rawhid_test
          ./tinyusb_rawhid_test failed
          ./tinyusb_rawhid_test successful
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile Arduino example
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli compile --fqbn arduino:avr:uno --libraries . \
            examples/Protocol_Self_Test
      - name: Install RP2040 TinyUSB toolchain
        run: |
          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040
      - name: Compile RP2040 Raw HID reference
        run: |
          arduino-cli compile --fqbn rp2040:rp2040:rpipico:usbstack=tinyusb \
            --libraries . examples/RP2040_VIA_RawHID
